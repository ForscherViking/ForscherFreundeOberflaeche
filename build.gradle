plugins {
    id 'java'
    id 'application'
}

group = 'com.forscherfreunde.hub'
version = '2.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Bewusst nur zwei schlanke Abhängigkeiten (~1,2 MB): JSON + modernes Look-and-Feel.
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.formdev:flatlaf:3.5.4'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Tests arbeiten in einem eigenen Datenordner statt auf dem echten Desktop.
    def sandbox = layout.buildDirectory.dir('test-sandbox').get().asFile
    doFirst { project.delete(sandbox); sandbox.mkdirs() }
    systemProperty 'ffhub.home', new File(sandbox, 'ForscherFreundeOberflaeche').absolutePath
    systemProperty 'ffhub.minecraft', new File(sandbox, 'minecraft-saves').absolutePath
    systemProperty 'java.awt.headless', 'true'
}

java {
    // Kompatibel mit der mitgelieferten JRE (17+)
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-serial,-processing,-this-escape']
}

application {
    mainClass = 'com.forscherfreunde.hub.FFHub'
    applicationDefaultJvmArgs = ['-XX:+UseSerialGC', '-Xms24m', '-Xmx192m', '-XX:TieredStopAtLevel=1']
}

jar {
    archiveFileName = 'ForscherFreundeHub.jar'
    manifest {
        attributes('Main-Class': 'com.forscherfreunde.hub.FFHub',
                   'Implementation-Version': project.version)
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/*/module-info.class', 'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
